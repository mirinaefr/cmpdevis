<style>
/* ══════════════════════════════════════════════
   CHARTE GRAPHIQUE callmeparis.
   Fond blanc + halo lavande · dégradé indigo→rose
   Typo : Pretendard uniquement (aucun serif)
   ══════════════════════════════════════════════ */
:root {
    /* Couleurs signature */
    --indigo:        #6366F1;
    --indigo-deep:   #4F46E5;
    --indigo-ink:    #3730A3;
    --pink:          #EC4899;
    --pink-deep:     #DB2777;
    --grad:          linear-gradient(115deg, #6366F1 0%, #A855F7 45%, #EC4899 100%);
    --grad-soft:     linear-gradient(115deg, #EEF0FE 0%, #FDF2F8 100%);

    /* Pastels */
    --lav-50:        #F7F6FF;
    --lav-100:       #EDEBFE;
    --lav-200:       #DDD9FB;
    --pink-50:       #FDF2F8;
    --pink-100:      #FCE7F3;

    /* Neutres */
    --ink:           #1E1B4B;
    --gray-400:      #9CA3AF;
    --gray-500:      #6B7280;
    --gray-600:      #4B5563;
    --gray-700:      #374151;
    --line:          #ECEAF8;
    --white:         #FFFFFF;

    --radius:        18px;
    --radius-sm:     12px;
    --radius-pill:   999px;

    --shadow:        0 2px 18px rgba(99, 102, 241, 0.07);
    --shadow-lift:   0 10px 34px rgba(99, 102, 241, 0.16);
    --shadow-grad:   0 12px 34px rgba(139, 92, 246, 0.28);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    background: var(--white);
    background-image:
        radial-gradient(900px 520px at -10% -6%, #F1EFFE 0%, rgba(255,255,255,0) 62%),
        radial-gradient(680px 420px at 108% 4%, #FDF0F7 0%, rgba(255,255,255,0) 60%);
    background-attachment: fixed;
    min-height: 100vh;
    color: var(--ink);
    padding: 16px;
    font-feature-settings: "tnum";
    -webkit-font-smoothing: antialiased;
}

#app {
    max-width: 540px;
    margin: 0 auto;
    padding-bottom: 120px;
}

.grad-text {
    background: var(--grad);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
}

/* ── Header ── */
.header { text-align: center; padding: 30px 0 22px; }
.header-logo {
    font-size: 30px;
    font-weight: 800;
    letter-spacing: -1.2px;
    background: var(--grad);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
}
.header-sub {
    font-size: 12.5px;
    color: var(--gray-500);
    margin-top: 6px;
    font-weight: 500;
    letter-spacing: 0.2px;
}

/* ── Barre de progression ── */
.progress-wrap { margin-bottom: 24px; }
.progress-bar { display: flex; gap: 5px; }
.progress-segment {
    flex: 1; height: 4px; border-radius: var(--radius-pill);
    background: var(--lav-100);
    transition: background 0.35s ease;
}
.progress-segment.active { background: var(--indigo); }
.progress-segment.done   { background: var(--grad); }
.progress-count {
    margin-top: 8px;
    font-size: 12px;
    font-weight: 600;
    color: var(--gray-400);
    text-align: right;
    letter-spacing: 0.4px;
}

/* ── Étapes ── */
.step-wrapper, .instant-result { animation: fadeUp 0.34s cubic-bezier(.2,.7,.3,1); }
@keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
}
@media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
}

.step-title {
    font-size: 21px;
    font-weight: 800;
    color: var(--ink);
    text-align: center;
    margin-bottom: 18px;
    line-height: 1.4;
    letter-spacing: -0.5px;
}
.step-subtitle {
    font-size: 13.5px;
    color: var(--gray-500);
    text-align: center;
    margin-top: -10px;
    margin-bottom: 20px;
    font-weight: 500;
}

/* ── Cartes de choix ── */
.cards { display: flex; flex-direction: column; gap: 10px; }
.cards.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.cards.grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }

.card {
    background: var(--white);
    border: 1.5px solid var(--line);
    border-radius: var(--radius);
    padding: 16px 18px;
    cursor: pointer;
    transition: border-color .18s, box-shadow .18s, transform .18s;
    position: relative;
    text-align: center;
}
.card:hover, .card:focus-visible {
    border-color: var(--indigo);
    box-shadow: var(--shadow-lift);
    transform: translateY(-2px);
    outline: none;
}
.card .card-title { font-size: 16px; font-weight: 700; color: var(--ink); letter-spacing: -0.3px; }
.card .card-desc  { font-size: 12px; color: var(--gray-500); margin-top: 4px; font-weight: 500; line-height: 1.45; }
.card .card-price {
    font-size: 14px; font-weight: 800; margin-top: 8px;
    background: var(--grad);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
}
.card .card-badge {
    position: absolute; top: -10px; right: 14px;
    background: var(--grad); color: var(--white);
    font-size: 11px; font-weight: 700;
    padding: 4px 12px; border-radius: var(--radius-pill);
    letter-spacing: 0.3px;
    box-shadow: 0 4px 12px rgba(236, 72, 153, 0.3);
}
.card.recommended {
    border-color: transparent;
    background: var(--grad-soft);
    box-shadow: inset 0 0 0 1.5px var(--indigo);
}
.card.recommended .card-title { color: var(--indigo-ink); }
.card.recommended .card-desc  { color: var(--indigo); }

/* ── Encadré info ── */
.info-box {
    background: var(--lav-50);
    border: 1px solid var(--lav-100);
    border-radius: var(--radius-sm);
    padding: 12px 16px;
    font-size: 13px;
    color: var(--gray-700);
    margin-top: 14px;
    line-height: 1.6;
    font-weight: 500;
}

/* ── Pilules de preuve ── */
.proof-pills {
    display: flex; flex-wrap: wrap; gap: 6px;
    justify-content: center;
    margin-bottom: 26px;
}
.pill {
    background: var(--lav-100);
    color: var(--indigo-ink);
    font-size: 11.5px; font-weight: 700;
    padding: 7px 13px;
    border-radius: var(--radius-pill);
    letter-spacing: -0.1px;
}
.pill.pink { background: var(--pink-100); color: var(--pink-deep); }

/* ── Garantie ── */
.guarantee {
    display: flex; align-items: center; gap: 12px;
    background: var(--white);
    border: 1.5px solid var(--lav-200);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin-bottom: 16px;
}
.guarantee .g-icon {
    width: 38px; height: 38px; flex-shrink: 0;
    border-radius: 11px;
    background: var(--grad-soft);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
}
.guarantee .g-title { font-size: 13.5px; font-weight: 800; color: var(--ink); letter-spacing: -0.3px; }
.guarantee .g-desc  { font-size: 12px; color: var(--gray-500); margin-top: 2px; line-height: 1.5; font-weight: 500; }

/* ── Carte prix ── */
.price-card {
    background: var(--grad);
    border-radius: var(--radius);
    padding: 26px 24px;
    text-align: center;
    color: var(--white);
    box-shadow: var(--shadow-grad);
    margin-bottom: 14px;
    position: relative;
    overflow: hidden;
}
.price-card::after {
    content: ""; position: absolute;
    width: 190px; height: 190px; border-radius: 50%;
    background: rgba(255,255,255,0.09);
    top: -80px; right: -60px;
}
.price-card > * { position: relative; z-index: 1; }
.price-card .price-label {
    font-size: 12.5px; font-weight: 600;
    opacity: 0.9; letter-spacing: 0.2px;
}
.price-card .price-per-session {
    font-size: 40px; font-weight: 800;
    margin: 10px 0 2px;
    letter-spacing: -1.6px;
    line-height: 1.05;
}
.price-card .price-unit { font-size: 17px; font-weight: 600; opacity: 0.85; letter-spacing: -0.3px; }
.price-card .price-caption { font-size: 13px; opacity: 0.9; font-weight: 500; }
.price-card .price-total {
    margin-top: 14px; padding-top: 13px;
    border-top: 1px solid rgba(255,255,255,0.22);
    font-size: 14px; font-weight: 600; opacity: 0.95;
}
.price-card .price-total strong { font-size: 18px; font-weight: 800; letter-spacing: -0.4px; }
.price-card .savings-tag {
    display: inline-block;
    background: rgba(255,255,255,0.2);
    padding: 5px 15px; border-radius: var(--radius-pill);
    font-size: 12.5px; font-weight: 700; margin-top: 12px;
}

/* ── Choix : remise Kakao ou tarif plein ── */
.disc-choice { margin-bottom: 14px; }
.disc-title {
    font-size: 12px; font-weight: 700; color: var(--indigo);
    letter-spacing: 0.4px; margin-bottom: 8px; text-align: center;
}
.disc-opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.disc-opt {
    font-family: inherit; text-align: center; cursor: pointer;
    background: var(--white); border: 1.5px solid var(--line);
    border-radius: var(--radius-sm); padding: 13px 10px;
    transition: border-color .18s ease, box-shadow .18s ease;
}
.disc-opt.wide { grid-column: 1 / -1; }
.disc-opt:hover { border-color: var(--indigo); }
.disc-opt:focus-visible { outline: 2.5px solid var(--indigo); outline-offset: 2px; }
.disc-opt .d-name { display: block; font-size: 14.5px; font-weight: 800; color: var(--ink); letter-spacing: -0.3px; }
.disc-opt .d-sub  { display: block; font-size: 11.5px; font-weight: 500; color: var(--gray-600); margin-top: 4px; line-height: 1.45; }
.disc-opt.on {
    border-color: transparent; background: var(--grad-soft);
    box-shadow: inset 0 0 0 2px var(--indigo);
}
.disc-opt.on .d-name { color: var(--indigo-ink); }
.disc-opt.on .d-sub  { color: var(--indigo); font-weight: 600; }

.price-card .price-caption + .price-full {
    margin-top: 14px; padding-top: 13px;
    border-top: 1px solid rgba(255,255,255,0.22);
}
.price-card .price-full {
    font-size: 13px; font-weight: 600; opacity: 0.92; margin-top: 8px;
}
.price-card .price-full s { opacity: 0.8; }
.breakdown-row .month-price s { color: var(--gray-600); font-weight: 500; margin-right: 6px; }

/* ── Détail mensuel ── */
.breakdown {
    background: var(--lav-50);
    border: 1px solid var(--lav-100);
    border-radius: var(--radius);
    padding: 16px 20px;
    margin-bottom: 14px;
}
.breakdown-title {
    font-size: 12px; font-weight: 700; color: var(--indigo);
    letter-spacing: 0.4px; margin-bottom: 10px; text-transform: uppercase;
}
.breakdown-row {
    display: flex; justify-content: space-between;
    font-size: 14px; padding: 6px 0; font-weight: 500;
}
.breakdown-row .month-label { color: var(--gray-600); }
.breakdown-row .month-price { font-weight: 700; color: var(--ink); }
.breakdown-row.discount .month-price { color: var(--pink-deep); }

/* ── Récapitulatif ── */
.summary-card {
    background: var(--white);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
    margin-bottom: 14px;
}
.summary-header {
    background: var(--grad-soft);
    padding: 16px 22px;
    text-align: center;
    border-bottom: 1px solid var(--lav-100);
}
.summary-header h3 { font-size: 15px; font-weight: 800; color: var(--indigo-ink); letter-spacing: -0.3px; }
.summary-body { padding: 8px 22px 16px; }
.summary-row {
    display: flex; justify-content: space-between; align-items: center; gap: 14px;
    padding: 11px 0;
    border-bottom: 1px solid var(--line);
    font-size: 13.5px;
}
.summary-row:last-child { border-bottom: none; }
.summary-row .label { color: var(--gray-500); font-weight: 500; flex-shrink: 0; }
.summary-row .value { font-weight: 700; color: var(--ink); text-align: right; }

/* ── Contenu de cours ── */
.course-info {
    background: var(--white);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px 22px;
    margin-bottom: 14px;
}
.course-info h4 { font-size: 15px; font-weight: 800; color: var(--ink); margin-bottom: 12px; letter-spacing: -0.3px; }
.course-info ul { list-style: none; padding: 0; }
.course-info li {
    font-size: 13.5px; color: var(--gray-700); font-weight: 500;
    padding: 5px 0 5px 22px; position: relative; line-height: 1.55;
}
.course-info li::before {
    content: "✓"; position: absolute; left: 0;
    color: var(--indigo); font-weight: 800;
}
.course-info .sub-h { font-weight: 800; font-size: 13.5px; margin-bottom: 6px; color: var(--indigo-ink); }

/* ── Avis ── */
.reviews { margin-bottom: 14px; }
.reviews-title {
    font-size: 12px; font-weight: 700; color: var(--gray-400);
    letter-spacing: 0.6px; text-transform: uppercase;
    text-align: center; margin-bottom: 10px;
}
.review {
    background: var(--white);
    border: 1px solid var(--line);
    border-left: 3px solid transparent;
    border-image: none;
    border-radius: var(--radius-sm);
    padding: 13px 16px;
    margin-bottom: 8px;
    position: relative;
}
.review::before {
    content: ""; position: absolute; left: 0; top: 10px; bottom: 10px;
    width: 3px; border-radius: 3px; background: var(--grad);
}
.review p { font-size: 13px; color: var(--gray-700); line-height: 1.6; font-weight: 500; }
.review .stars { font-size: 11px; color: var(--pink); margin-bottom: 5px; letter-spacing: 1px; }

/* ── FAQ ── */
.faq {
    background: var(--white);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
    margin-bottom: 14px;
}
.faq details { border-bottom: 1px solid var(--line); }
.faq details:last-child { border-bottom: none; }
.faq summary {
    padding: 14px 18px;
    font-size: 13.5px; font-weight: 700; color: var(--ink);
    cursor: pointer; list-style: none;
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
}
.faq summary::-webkit-details-marker { display: none; }
.faq summary::after {
    content: "+"; color: var(--indigo); font-size: 18px; font-weight: 700;
    flex-shrink: 0; transition: transform .2s;
}
.faq details[open] summary::after { content: "−"; }
.faq .faq-body {
    padding: 0 18px 15px;
    font-size: 13px; color: var(--gray-600); line-height: 1.65; font-weight: 500;
}

/* ── Boutons ── */
.btn-group { display: flex; gap: 10px; margin-top: 18px; }
.btn {
    flex: 1;
    padding: 15px 18px;
    border: none;
    border-radius: var(--radius-sm);
    font-family: inherit;
    font-size: 15px; font-weight: 700;
    cursor: pointer;
    transition: transform .18s, box-shadow .18s, border-color .18s, color .18s;
    text-align: center;
    letter-spacing: -0.3px;
}
.btn-primary {
    background: var(--grad);
    color: var(--white);
    box-shadow: var(--shadow-grad);
}
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 16px 40px rgba(139, 92, 246, 0.36); }
.btn-secondary {
    background: var(--white);
    color: var(--gray-600);
    border: 1.5px solid var(--line);
}
.btn-secondary:hover { border-color: var(--indigo); color: var(--indigo); }
.btn-back {
    background: none; border: none;
    color: var(--gray-400);
    font-size: 14px; font-family: inherit; font-weight: 600;
    cursor: pointer; padding: 6px 0; margin-bottom: 12px;
    display: flex; align-items: center; gap: 6px;
    transition: color .2s;
}
.btn-back:hover { color: var(--indigo); }
.btn-back svg { width: 16px; height: 16px; }
:focus-visible { outline: 2px solid var(--indigo); outline-offset: 3px; border-radius: 6px; }

/* ── Page d'accueil ── */
.start-page { padding: 8px 0 20px; }
.start-hook {
    text-align: center;
    font-size: 24px; font-weight: 800;
    line-height: 1.45; letter-spacing: -0.8px;
    color: var(--ink);
    margin-bottom: 8px;
}
.start-hook .grad-text { display: inline; }
.tagline {
    font-size: 14px; color: var(--gray-500);
    text-align: center; margin-bottom: 22px; line-height: 1.6; font-weight: 500;
}
.start-options { display: flex; flex-direction: column; gap: 11px; }
.start-card {
    background: var(--white);
    border: 1.5px solid var(--line);
    border-radius: var(--radius);
    padding: 18px;
    cursor: pointer;
    transition: border-color .18s, box-shadow .18s, transform .18s;
    text-align: left;
    display: flex; align-items: center; gap: 15px;
}
.start-card:hover { border-color: var(--indigo); box-shadow: var(--shadow-lift); transform: translateY(-2px); }
.start-card .icon {
    width: 46px; height: 46px; border-radius: 13px;
    display: flex; align-items: center; justify-content: center;
    font-size: 21px; flex-shrink: 0;
    background: var(--lav-100);
}
.start-card .icon.pink { background: var(--pink-100); }
.start-card .sc-title { font-size: 15.5px; font-weight: 700; color: var(--ink); letter-spacing: -0.4px; line-height: 1.35; }
.start-card .sc-desc  { font-size: 12px; color: var(--gray-500); margin-top: 3px; font-weight: 500; }
.start-card .sc-price {
    font-size: 12.5px; font-weight: 800; margin-top: 5px;
    background: var(--grad);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
}

/* ── Barre collante ── */
#sticky {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    z-index: 50;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    background: rgba(255,255,255,0.9);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-top: 1px solid var(--lav-100);
    transform: translateY(110%);
    transition: transform .3s cubic-bezier(.2,.7,.3,1);
}
#sticky.visible { transform: translateY(0); }
#sticky .inner { max-width: 540px; margin: 0 auto; }
.sticky-price { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.sticky-price .sp-label { font-size: 11.5px; color: var(--gray-500); font-weight: 600; }
.sticky-price .sp-value {
    font-size: 21px; font-weight: 800; letter-spacing: -0.7px;
    background: var(--grad);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
}
.sticky-price .sp-note { font-size: 11px; color: var(--gray-400); font-weight: 500; margin-top: 1px; }
#sticky .btn { padding: 14px 20px; }

/* ── Toast ── */
#toast {
    position: fixed;
    left: 50%; bottom: 96px;
    transform: translateX(-50%) translateY(16px);
    z-index: 90;
    background: var(--ink);
    color: var(--white);
    font-size: 13px; font-weight: 600;
    padding: 12px 20px;
    border-radius: var(--radius-pill);
    box-shadow: 0 10px 30px rgba(30, 27, 75, 0.3);
    opacity: 0; pointer-events: none;
    transition: opacity .25s, transform .25s;
    max-width: 88vw; text-align: center;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── Repli copie manuelle ── */
#copybox {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(30, 27, 75, 0.55);
    backdrop-filter: blur(4px);
    display: none; align-items: center; justify-content: center;
    padding: 20px;
}
#copybox.show { display: flex; }
#copybox .cb-inner {
    background: var(--white);
    border-radius: var(--radius);
    padding: 20px;
    max-width: 460px; width: 100%;
}
#copybox h4 { font-size: 15px; font-weight: 800; margin-bottom: 10px; }
#copybox textarea {
    width: 100%; height: 190px;
    border: 1.5px solid var(--line); border-radius: var(--radius-sm);
    padding: 12px; font-family: inherit; font-size: 12.5px; line-height: 1.6;
    color: var(--gray-700); resize: none;
}

// ══════════════════════════════════════════════
// MODÈLE DE PRIX
//  · 1er mois    = tarif plein (1 mois), −15 % si catégorie Kakao
//  · 2e mois et + = tarif d'engagement : −10 % (2 mois) / −20 % (4 mois)
//                   par rapport au tarif plein
// ══════════════════════════════════════════════
function durationPct(months) {
    const t = PRODUCTS.conversation.tiers;
    return Math.round((1 - t[months] / t[1]) * 100);
}

function priceMode() { return state.choices.mode || (state.choices.noDiscount ? "full" : "kakao"); }
function discountOn() { return priceMode() === "kakao"; }

function monthsRange(months) { return months === 2 ? "2개월 차" : "2~" + months + "개월 차"; }
// En extension, la remise d'engagement couvre tous les mois (1er compris)
function engRange(pr, months) {
    return pr.isExtend ? (months === 1 ? "1개월 차" : "1~" + months + "개월 차") : monthsRange(months);
}

function priceModel(fullMonthly, engagedMonthly, months) {
    const on = discountOn();
    const full = roundPrice(fullMonthly);
    const engaged = roundPrice(engagedMonthly);
    const m1Kakao = roundPrice(fullMonthly * (1 - FIRST_MONTH_DISCOUNT));
    // Extension : remise d'engagement sur TOUS les mois choisis, pas de remise Kakao
    if (priceMode() === "extend") {
        const total = months * engaged;
        const fullTotal = full * months;
        return {
            isExtend: true, on: false, full: full, engaged: engaged, m1: engaged, rest: months,
            total: total, fullTotal: fullTotal,
            kakaoSaved: full - m1Kakao,
            engSaved: months * (full - engaged),
            saved: fullTotal - total,
        };
    }

    const m1 = on ? m1Kakao : full;
    const rest = Math.max(0, months - 1);
    const total = m1 + rest * engaged;
    const fullTotal = full * months;
    return {
        isExtend: priceMode() === "extend",
        on: on, full: full, engaged: engaged, m1: m1, rest: rest,
        total: total, fullTotal: fullTotal,
        kakaoSaved: full - m1Kakao,          // économie possible sur le 1er mois
        engSaved: rest * (full - engaged),   // économie d'engagement (mois 2+)
        saved: fullTotal - total,
    };
}

function addDiscountChoice(container, kakaoSaved) {
    const mode = priceMode();
    const wrap = el("div", "disc-choice");

        <div class="disc-title">요금 유형을 선택하세요</div>
        <div class="disc-opts">

                <span class="d-sub">카카오 채널 친구 추가 시<br>${fmt(kakaoSaved)}원 절약</span>
            </button>
            <button type="button" class="disc-opt ${mode === "full" ? "on" : ""}" data-v="full">
                <span class="d-name">첫 달 정가로 진행</span>
                <span class="d-sub">친구 추가 없이<br>신규 등록 시</span>
            </button>
            <button type="button" class="disc-opt wide ${mode === "extend" ? "on" : ""}" data-v="extend">
                <span class="d-name">연장 등록</span>
                <span class="d-sub">수강 중이시거나 이전 수강생이신 경우<br>선택한 전체 기간에 등록 할인 적용 · 카카오 할인은 첫 등록 전용</span>
            </button>
        </div>
    `;
    wrap.querySelectorAll(".disc-opt").forEach(b => {
        b.onclick = () => {
            const v = b.dataset.v;
            if (v === priceMode()) return;
            state.choices.mode = v;
            delete state.choices.noDiscount;
            const y = window.scrollY;
            render();
            window.scrollTo(0, y);
        };
    });
    container.appendChild(wrap);
}

function priceLines(pr, months, pct) {
    const lines = [];
    lines.push(pr.saved > 0 ? `정가 <s>${fmt(pr.fullTotal)}원</s>` : `정가 · 할인 미적용`);
    if (pr.on) lines.push(`첫 달 카카오 15% 할인 −${fmt(pr.kakaoSaved)}원`);
    if (pr.engSaved > 0) lines.push(`${engRange(pr, months)} 등록 할인 −${pct}% · −${fmt(pr.engSaved)}원`);
    return lines.map(l => `<div class="price-full">${l}</div>`).join("");
}

function breakdownHtml(pr, months, pct) {
    let h = `<div class="breakdown-title">월별 상세</div>`;
    if (pr.isExtend) {
        const disc = pr.engSaved > 0;
        h += `<div class="breakdown-row ${disc ? "discount" : ""}"><span class="month-label">${engRange(pr, months)}${disc ? " · 등록 할인 -" + pct + "%" : ""}</span><span class="month-price">${disc ? `<s>${fmt(pr.full)}원</s>` : ""}${fmt(pr.engaged)}원 / 월</span></div>`;
        return h;
    }
    h += `<div class="breakdown-row ${pr.on ? "discount" : ""}"><span class="month-label">1개월 차${pr.on ? " · 카카오 15% 할인" : ""}</span><span class="month-price">${pr.on ? `<s>${fmt(pr.full)}원</s>` : ""}${fmt(pr.m1)}원</span></div>`;
    if (pr.rest > 0) {
        const disc = pr.engSaved > 0;
        h += `<div class="breakdown-row ${disc ? "discount" : ""}"><span class="month-label">${monthsRange(months)}${disc ? " · 등록 할인 -" + pct + "%" : ""}</span><span class="month-price">${disc ? `<s>${fmt(pr.full)}원</s>` : ""}${fmt(pr.engaged)}원 / 월</span></div>`;
    }
    return h;
}

function discountLabel(pr) {
    if (pr.isExtend) return "해당 없음 (연장 등록)";
    return pr.on ? "15% 적용 (카카오 채널 친구 추가)" : "미적용 (첫 달 정가)";
}

function discountRows(pr, months, pct) {
    return (pr.isExtend ? row("등록 구분", "연장 등록") : "")
         + (pr.engSaved > 0 ? row("등록 기간 할인", engRange(pr, months) + " -" + pct + "%") : "")
         + row("첫 달 할인", discountLabel(pr))
         + (pr.saved > 0 ? row("정가", fmt(pr.fullTotal) + "원") : "");
}

function discountQuoteRows(pr, months, pct) {
    const r = [];
    if (pr.isExtend) r.push(["등록 구분", "연장 등록 (재등록)"]);
    if (pr.engSaved > 0) r.push(["등록 기간 할인", engRange(pr, months) + " -" + pct + "%"]);
    r.push(["첫 달 할인", discountLabel(pr)]);
    if (pr.saved > 0) r.push(["정가", fmt(pr.fullTotal) + "원"]);
    return r;
}

            ${row("과정", lvl.label + " 구술 시험 실전 연습")}
            ${row("형식", "주 2회 · 30분")}

            ${row("포함", "PDF 자료 · 피드백 · 주간 리포트")}
        </div>
    `;
    container.appendChild(sc);

    const goals = el("div", "course-info");
    goals.innerHTML = `

// ── CONVERSATION ──
function renderConversation() {
    const div = el("div", "step-wrapper");
    div.innerHTML = `<div class="header"><div class="header-logo">callmeparis.</div></div>`;
    APP.appendChild(div);

    addBackBtn(div, () => {
        if (state.step > 0) { state.step--; render(); }
        else { state.path = null; render(); }
    });

    const totalSteps = 5; // level · courseType · duration · frequency · commitment
    addProgress(div, state.step, totalSteps);

    if (state.step === 0) {
        addTitle(div, "본인의 프랑스어 실력을 선택하세요");
        addSubtitle(div, "정확하지 않아도 괜찮습니다");
        const cards = el("div", "cards grid-3");

            const card = mkCard(lvl.code, lvl.desc, null);

        });

        const unknown = el("div", "cards");
        unknown.style.marginTop = "10px";
        const uc = mkCard("잘 모르겠어요", "첫 수업에서 강사가 진단해 드립니다", null);
        uc.onclick = () => { state.choices.level = "미정"; state.step++; render(); window.scrollTo(0,0); };
        unknown.appendChild(uc);
        div.appendChild(unknown);
    }
    else if (state.step === 1) {
        addTitle(div, "수업 과정을 선택하세요");
        const cards = el("div", "cards");
        const lv = state.choices.level;
        const levelIdx = LEVELS.findIndex(l => l.code === lv);
        COURSE_TYPES.forEach(ct => {
            if (ct.minLevel && lv !== "미정" && levelIdx < LEVELS.findIndex(l => l.code === ct.minLevel)) return;
            const card = mkCard(ct.label, ct.desc, null);
            card.onclick = () => { state.choices.courseType = ct.label; state.step++; render(); window.scrollTo(0,0); };
            cards.appendChild(card);
        });
        div.appendChild(cards);
        if (lv !== "미정" && levelIdx < 2) {
            addInfoBox(div, "A1·A2 레벨에서는 일반 회화 과정만 이용 가능합니다.");
        } else if (lv === "미정") {
            addInfoBox(div, "레벨이 정해지지 않았다면 일반 회화를 추천드립니다. 첫 수업 후 언제든 변경 가능합니다.");
        }
    }
    else if (state.step === 2) {
        addTitle(div, "1회 수업 시간을 선택하세요");
        const cards = el("div", "cards grid-2");
        PRODUCTS.conversation.durations.forEach(d => {
            const monthly = roundPrice(PRODUCTS.conversation.tiers[1] * (parseInt(d) * 1 * 4) / 60);
            const card = mkCard(d, d === "15분" ? "짧고 집중적인" : "깊이 있는 대화", null);
            card.innerHTML += `<div class="card-price">월 ${fmt(monthly)}원부터</div>`;
            card.onclick = () => { state.choices.duration = d; state.step++; render(); window.scrollTo(0,0); };
            cards.appendChild(card);
        });
        div.appendChild(cards);
        addInfoBox(div, "주 1회 · 기본 요금 기준 금액입니다. 첫 달 카카오 15% 할인, 2개월 차부터 등록 할인(2개월 -" + durationPct(2) + "% · 4개월 -" + durationPct(4) + "%)이 추가로 적용됩니다.");
    }
    else if (state.step === 3) {
        addTitle(div, "주당 수업 횟수를 선택하세요");
        const durMin = parseInt(state.choices.duration);
        const cards = el("div", "cards grid-3");
        PRODUCTS.conversation.frequencies.forEach(f => {
            const monthly = roundPrice(PRODUCTS.conversation.tiers[1] * (durMin * parseInt(f) * 4) / 60);
            const card = mkCard(f, "", null);
            card.innerHTML += `<div class="card-price">월 ${fmt(monthly)}원</div>`;
            card.onclick = () => { state.choices.frequency = f; state.step++; render(); window.scrollTo(0,0); };
            cards.appendChild(card);
        });
        div.appendChild(cards);
        addInfoBox(div, "기본 요금 기준 금액입니다. 첫 달 카카오 15% 할인, 2개월 차부터 등록 할인(2개월 -" + durationPct(2) + "% · 4개월 -" + durationPct(4) + "%)이 추가로 적용됩니다.");
    }
    else if (state.step === 4) {
        addTitle(div, "등록 기간을 선택하세요");
        addSubtitle(div, "2개월 차부터 등록 할인: 2개월 -" + durationPct(2) + "% · 4개월 -" + durationPct(4) + "% (기본 요금 대비)");
        const cards = el("div", "cards");
        const hpm = hoursPerMonth();
        const fullM = roundPrice(PRODUCTS.conversation.tiers[1] * hpm);
        PRODUCTS.conversation.commitments.forEach(c => {
            const engaged = roundPrice(PRODUCTS.conversation.tiers[c.months] * hpm);
            const pct = durationPct(c.months);
            const card = mkCard(
                c.label,
                c.months === 1 ? "부담 없이 시작 · 등록 할인 없음"
                               : "2개월 차부터 -" + pct + "%" + (c.months === 2 ? " · 가장 많이 선택" : " · 최저가"),
                c.tag
            );
            card.innerHTML += `<div class="card-price">${c.months === 1 ? "월 " + fmt(fullM) + "원" : "2개월 차부터 월 " + fmt(engaged) + "원"}</div>`;

            card.onclick = () => { state.choices.commitment = c; state.step++; render(); window.scrollTo(0,0); };
            cards.appendChild(card);
        });
        div.appendChild(cards);
        addInfoBox(div, "첫 등록 시 1개월 차 15% 할인 (카카오 채널 친구 추가 필요) · 등록 할인은 2개월 차부터 적용됩니다. 연장 등록 시에는 선택한 전체 기간에 등록 할인이 적용됩니다.");
    }
    else {
        renderConversationSummary(div);
    }

    // Barre de prix live à l'étape du choix d'engagement (le récap gère sa propre barre CTA)
    if (state.step === 4) showStickyPrice();
}

function hoursPerMonth() {
    const durMin = parseInt(state.choices.duration);
    const freq = parseInt(state.choices.frequency);
    return (durMin * freq * 4) / 60;
}

// ══════════════════════════════════════════════
// ENVOI KAKAO — récapitulatif copié automatiquement
// ══════════════════════════════════════════════
function buildQuoteText() {
    const q = state.quote;
    if (!q) return "";
    let t = "[callmeparis. 수강 신청]\n\n";
    t += "▸ " + q.title + "\n";
    q.rows.forEach(r => { t += "· " + r[0] + " : " + r[1] + "\n"; });
    t += "\n▸ " + q.totalLabel + " : " + fmt(q.total) + "원\n";
    t += "\n이 조건으로 등록하고 싶습니다. 안내 부탁드립니다!";
    return t;
}

window.cbOpenKakao = function() {
    document.getElementById("copybox").classList.remove("show");
    window.open(KAKAO_URL, "_blank");
};

function sendToKakao() {
    const text = buildQuoteText();
    track("Lead", { content_name: state.quote ? state.quote.title : "견적", value: state.quote ? state.quote.total : 0, currency: "KRW" });

    const openKakao = () => window.open(KAKAO_URL, "_blank");

    if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(() => {
            showToast("견적 내용이 복사되었습니다. 카카오에 붙여넣기 해주세요!");
            setTimeout(openKakao, 700);
        }).catch(() => fallbackCopy(text));
    } else {
        fallbackCopy(text);
    }
}
window.sendToKakao = sendToKakao;

function fallbackCopy(text) {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch(e) { ok = false; }
    document.body.removeChild(ta);

    if (ok) {
        showToast("견적 내용이 복사되었습니다. 카카오에 붙여넣기 해주세요!");
        setTimeout(() => window.open(KAKAO_URL, "_blank"), 700);
    } else {
        document.getElementById("copybox-text").value = text;
        document.getElementById("copybox").classList.add("show");
    }
}

function showToast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 3200);
}

// ══════════════════════════════════════════════
// UTILITAIRES
// ══════════════════════════════════════════════
function el(tag, className) {
    const e = document.createElement(tag);
    if (className) e.className = className;
    return e;
}

function row(label, value) {
    return `<div class="summary-row"><span class="label">${label}</span><span class="value">${value}</span></div>`;
}

function mkCard(title, desc, badge) {
    const card = el("div", "card");
    card.setAttribute("tabindex", "0");
    let html = `<div class="card-title">${title}</div>`;
    if (desc) html += `<div class="card-desc">${desc}</div>`;
    if (badge) html = `<div class="card-badge">${badge}</div>` + html;
    card.innerHTML = html;
    card.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); card.click(); } };
    return card;
}

function addTitle(container, text) {
    const t = el("div", "step-title");
    t.textContent = text;
    container.appendChild(t);
}

function addSubtitle(container, text) {
    const s = el("div", "step-subtitle");
    s.textContent = text;
    container.appendChild(s);
}

function addInfoBox(container, text) {
    const box = el("div", "info-box");
    box.textContent = text;
    container.appendChild(box);
}

function addProgress(container, current, total) {
    const wrap = el("div", "progress-wrap");
    const bar = el("div", "progress-bar");
    for (let i = 0; i < total; i++) {
        const seg = el("div", "progress-segment");
        if (i < current) seg.classList.add("done");
        else if (i === current) seg.classList.add("active");
        bar.appendChild(seg);
    }
    wrap.appendChild(bar);
    const count = el("div", "progress-count");
    count.textContent = Math.min(current + 1, total) + " / " + total;
    wrap.appendChild(count);
    container.appendChild(wrap);
}

function addBackBtn(container, onClick) {
    const btn = el("button", "btn-back");
    btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg> 뒤로`;
    btn.onclick = onClick;
    container.appendChild(btn);
}

function fmt(n) {
    return new Intl.NumberFormat("ko-KR").format(Math.round(n));
}

function roundPrice(price) {
    return Math.round(price / 1000) * 1000;
}
